name: Aether Calculator

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/calculator/dist/calculator.elf'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add x86_64-unknown-none
      - name: Build Calculator ELF
        working-directory: apps/calculator
        run: cargo build --release
      - name: Validate ELF
        run: |
          file apps/calculator/target/x86_64-unknown-none/release/calculator
          readelf -h apps/calculator/target/x86_64-unknown-none/release/calculator
      - name: Publish Calculator ELF into repository package tree
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p apps/calculator/dist
          cp apps/calculator/target/x86_64-unknown-none/release/calculator apps/calculator/dist/calculator.elf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/calculator/dist/calculator.elf
          if git diff --cached --quiet; then
            echo "Calculator ELF unchanged"
            exit 0
          fi
          git commit -m "build: publish Calculator ELF"
          git push
